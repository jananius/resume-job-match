<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ResumeIQ | Error</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f7f9fc;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .card {
            background: white;

            width: 90%;

            max-width: 500px;

            padding: 40px;

            border-radius: 18px;

            text-align: center;

            border: 1px solid #e5e7eb;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
        }


        .icon {
            font-size: 50px;

            margin-bottom: 20px;
        }


        h1 {
            margin-bottom: 12px;

            color: #dc2626;
        }


        p {
            color: #6b7280;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        .button {
            display: inline-block;

            padding: 13px 22px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

    </style>

</head>


<body>


    <div class="card">

        <div class="icon">
            ⚠️
        </div>


        <h1>
            Something went wrong
        </h1>


        <p
            th:text="${error}">
            Unable to process your request.
        </p>


        <a
            href="/"
            class="button">

            Try Again

        </a>

    </div>


</body>

</html>
